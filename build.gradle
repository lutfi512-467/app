plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webwindow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webwindow.app'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main.python.srcDir 'src/main/python'
    }
}


chaquopy {
    defaultConfig {
        pip {
            install 'flask>=3.0'
            install 'requests>=2.31'
        }
    }
}
