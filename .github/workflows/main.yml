name: Build WebWindow APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project structure
        run: |
          mkdir -p app/src/main/java/com/webwindow/app
          mkdir -p app/src/main/python/templates

          [ ! -f AndroidManifest.xml ] || mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ ! -f MainActivity.kt ] || mv MainActivity.kt app/src/main/java/com/webwindow/app/MainActivity.kt
          [ ! -f app.py ] || mv app.py app/src/main/python/app.py
          [ ! -f embedded_server.py ] || mv embedded_server.py app/src/main/python/embedded_server.py
          [ ! -f index.html ] || mv index.html app/src/main/python/templates/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebWindow"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.chaquo.python' version '16.1.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.chaquo.python'
          }

          android {
              namespace 'com.webwindow.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.webwindow.app'
                  minSdk 24
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              sourceSets {
                  main.python.srcDir 'src/main/python'
              }
          }

          chaquopy {
              defaultConfig {
                  pip {
                      install 'flask>=3.0'
                      install 'requests>=2.31'
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebWindow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
